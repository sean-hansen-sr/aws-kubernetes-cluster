apiVersion: v1
kind: Namespace
metadata:
  name: agent-service-namespace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service-deployment
  namespace: agent-service-namespace
  labels:
    app: agent-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service-container
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>://<IMAGE_NAME>:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: agent-service-namespace
spec:
  type: NodePort
  selector:
    app: agent-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080