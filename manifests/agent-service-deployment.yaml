apiVersion: v1
kind: Namespace
metadata:
  name: <NAMESPACE_NAME>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <DEPLOYMENT_NAME>
  namespace: <NAMESPACE_NAME>
  labels:
    app: <APP_NAME>
spec:
  replicas: 2
  selector:
    matchLabels:
      app: <APP_NAME>
  template:
    metadata:
      labels:
        app: <APP_NAME>
    spec:
      imagePullSecrets:
        - name: <ECR_REGISTRY_SECRET_NAME>
      containers:
        - name: <CONTAINER_NAME>
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/<IMAGE_NAME>:latest
          ports:
            - containerPort: <CONTAINER_PORT>
---
apiVersion: v1
kind: Service
metadata:
  name: <SERVICE_NAME>
  namespace: <NAMESPACE_NAME>
spec:
  type: NodePort
  selector:
    app: <APP_NAME>
  ports:
    - protocol: TCP
      port: <SERVICE_PORT>
      targetPort: <CONTAINER_PORT>
      nodePort: <NODE_PORT>